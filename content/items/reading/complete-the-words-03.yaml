    title: Coral reefs
    text: >-
      Coral reefs cover less than one percent of the ocean floor. [[However]], they support [[roughly]] a quarter
      of [[all]] marine species. [[Rising]] water temperatures cause [[corals]] to expel the [[algae]] that provide
      [[them]] with food, a [[process]] known as [[bleaching]]. If [[conditions]] do not improve, the [[reefs]]
      may never recover.
