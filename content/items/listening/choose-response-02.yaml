        answer: 0
  - id: lcr-02-b
    cefr: A2
    lines: [{speaker: Student, voice: female, text: "What time does the seminar start?"}]
    questions:
      - id: q1
        prompt: "Choose the best response."
        options: ["In room 104.", "At two o'clock.", "Professor Lee.", "For about an hour."]
        answer: 1
  - id: lcr-02-c
    cefr: A2
    lines: [{speaker: Student, voice: male, text: "Excuse me, is this seat taken?"}]
    questions:
      - id: q1
        prompt: "Choose the best response."
        options: ["I took it home.", "Yes, I sit.", "No, go ahead.", "The seat is soft."]
