title: "Listen and Repeat · Campus orientation"
time_limit_s: 300
scene: "Orientation day. A student guide is showing new students around the campus."
directions: >-
  You will hear a speaker say a sentence. After the beep, repeat exactly what you heard.
  Recording starts automatically and stops when the time is up. You will hear each sentence only once.
