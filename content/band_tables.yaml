# Raw score → estimated 1–6 band.  ESTIMATE ONLY — ETS's real conversion is IRT-based and unpublished.
#
# Method: a section percentage is placed on the old 0–30 section scale (pct × 30) and converted with ETS's
# published comparison table (old 0–30 section scores ↔ new 1–6 bands, from
# https://www.ets.org/toefl/test-takers/ibt/scores/understand-scores.html). Each list gives the lowest
# old-scale score for each band. Tune after collecting calibration data (week 7).
version: bands-2026.1
old_scale_min:
  reading:   {6: 29, 5.5: 27, 5: 24, 4.5: 22, 4: 18, 3.5: 12, 3: 6, 2.5: 4, 2: 3, 1.5: 2, 1: 0}
  listening: {6: 28, 5.5: 26, 5: 22, 4.5: 20, 4: 17, 3.5: 13, 3: 9, 2.5: 6, 2: 4, 1.5: 2, 1: 0}
  speaking:  {6: 28, 5.5: 27, 5: 25, 4.5: 23, 4: 20, 3.5: 18, 3: 16, 2.5: 13, 2: 10, 1.5: 5, 1: 0}
  writing:   {6: 29, 5.5: 27, 5: 24, 4.5: 21, 4: 17, 3.5: 15, 3: 13, 2.5: 11, 2: 7, 1.5: 3, 1: 0}

# Comparable 0–120 total shown next to the overall band = midpoint of the ETS total range for that band.
total_ranges:
  6: [114, 120]
  5.5: [107, 113]
  5: [95, 106]
  4.5: [86, 94]
  4: [72, 85]
  3.5: [58, 71]
  3: [44, 57]
  2.5: [34, 43]
  2: [24, 33]
  1.5: [12, 23]
  1: [0, 11]

# Approximate CEFR alignment of whole bands (verify against ETS's score-scale guidance).
cefr: {6: C2, 5: C1, 4: B2, 3: B1, 2: A2, 1: A1}

# Multistage (adaptive) Reading/Listening: section % = router_weight·router% + (1−router_weight)·module2%·w,
# where w = 1 for the upper module and lower_module_weight for the lower module, so an easier second module
# cannot produce the top bands.
adaptive:
  router_weight: 0.5
  lower_module_weight: 0.6
